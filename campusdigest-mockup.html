<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusDigest Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              brand: {
                50: "#eef6ff",
                100: "#d9eaff",
                500: "#4f7cff",
                600: "#3a67f2",
              },
              mint: {
                100: "#dcfce7",
                500: "#22c55e",
              },
            },
            boxShadow: {
              soft: "0 10px 30px -12px rgba(15, 23, 42, 0.25)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: radial-gradient(circle at top, #f0f7ff 0%, #f8fafc 45%, #eef2ff 100%);
      }
    </style>
  </head>
  <body class="min-h-screen font-sans text-slate-800 antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const categories = ["Technology", "Finance", "Health", "Business", "Global"];

      const articles = [
        {
          id: 1,
          category: "Technology",
          title: "OpenAI unveils GPT-5 tools for student researchers",
          summary:
            "Campus innovation clubs are testing GPT-5 assistants for citation support and topic exploration. Early pilots report faster draft quality with fewer factual mistakes when sources are pinned.",
          readTime: "4 min read",
          reactions: 132,
          comments: 27,
          shares: 11,
          saved: true,
        },
        {
          id: 2,
          category: "Finance",
          title: "Student budgeting apps now integrate meal-plan spending alerts",
          summary:
            "Universities partnering with fintech startups are helping students avoid end-of-month meal shortages by sending personalized spending nudges tied to campus card data.",
          readTime: "3 min read",
          reactions: 89,
          comments: 18,
          shares: 7,
          saved: false,
        },
        {
          id: 3,
          category: "Health",
          title: "Late-night study habits linked to next-day focus dips",
          summary:
            "A multi-campus survey found students who shifted 30 minutes of nightly screen time into sleep reported noticeably better concentration during morning lectures and labs.",
          readTime: "5 min read",
          reactions: 204,
          comments: 41,
          shares: 15,
          saved: false,
        },
      ];

      const comments = [
        {
          id: 1,
          name: "Mia R.",
          major: "CS, Year 3",
          time: "2m ago",
          message:
            "The summary is solid, but I still worry about citation drift in longer papers. Anyone tested it with IEEE formatting yet?",
          isReply: false,
        },
        {
          id: 2,
          name: "Arjun K.",
          major: "Data Science",
          time: "5m ago",
          message:
            "I tried it last night for our robotics report. If you lock in 3 primary sources first, GPT-5 sticks closer to facts.",
          isReply: true,
        },
        {
          id: 3,
          name: "Sofia L.",
          major: "Economics",
          time: "8m ago",
          message:
            "Can we create a shared prompt template for the class? It would help keep everyone's summaries consistent.",
          isReply: false,
        },
        {
          id: 4,
          name: "Noah P.",
          major: "Biotech",
          time: "12m ago",
          message:
            "Yes please. Also adding a 'counter-argument' prompt improved my literature review quality a lot.",
          isReply: true,
        },
        {
          id: 5,
          name: "Leah T.",
          major: "Media Studies",
          time: "16m ago",
          message:
            "I like that this room keeps article discussion in one place. Way cleaner than scattered class group chats.",
          isReply: false,
        },
      ];

      const iconClass = "h-4 w-4";

      const HomeIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
      );

      const CompassIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <circle cx="12" cy="12" r="9" />
          <path d="m14.7 9.3-2.2 5.4-5.2 2.2 2.2-5.4z" />
        </svg>
      );

      const BookmarkIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <path d="M6 4h12v16l-6-3.5L6 20z" />
        </svg>
      );

      const ChatIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <path d="M7 17.5h10l4 3V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2Z" />
        </svg>
      );

      const HeartIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <path d="M12 20.2 4.9 13a4.8 4.8 0 1 1 6.8-6.8L12 6.5l.3-.3A4.8 4.8 0 1 1 19.1 13z" />
        </svg>
      );

      const ShareIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={iconClass}>
          <path d="M14 5h6v6" />
          <path d="m20 4-8.5 8.5" />
          <path d="M20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4.5" />
        </svg>
      );

      const SaveChip = ({ saved }) => (
        <button className="inline-flex items-center gap-1 rounded-full border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 transition hover:border-brand-500 hover:text-brand-600">
          <BookmarkIcon />
          {saved ? "Saved" : "Save"}
        </button>
      );

      function CategoryChip({ label, active }) {
        return (
          <button
            className={`rounded-full px-4 py-2 text-sm font-medium transition ${
              active
                ? "bg-brand-600 text-white shadow-md shadow-brand-600/30"
                : "bg-slate-100 text-slate-600 hover:bg-slate-200"
            }`}
          >
            {label}
          </button>
        );
      }

      function ArticleCard({ article }) {
        return (
          <article className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            <div className="mb-3 flex items-start justify-between gap-3">
              <span className="rounded-full bg-brand-50 px-2.5 py-1 text-xs font-semibold text-brand-600">
                {article.category}
              </span>
              <SaveChip saved={article.saved} />
            </div>
            <h3 className="text-base font-semibold leading-snug text-slate-900">{article.title}</h3>
            <p className="mt-2 text-sm leading-relaxed text-slate-600">{article.summary}</p>
            <div className="mt-3 flex items-center justify-between text-xs text-slate-500">
              <span>{article.readTime}</span>
              <span className="rounded-full bg-mint-100 px-2 py-0.5 font-medium text-mint-500">
                AI summary
              </span>
            </div>
            <div className="mt-3 flex items-center gap-4 border-t border-slate-100 pt-3 text-xs font-medium text-slate-500">
              <div className="inline-flex items-center gap-1.5">
                <HeartIcon />
                {article.reactions}
              </div>
              <div className="inline-flex items-center gap-1.5">
                <ChatIcon />
                {article.comments}
              </div>
              <div className="inline-flex items-center gap-1.5">
                <ShareIcon />
                {article.shares}
              </div>
            </div>
          </article>
        );
      }

      function CommentBubble({ comment }) {
        return (
          <div className={`flex gap-3 ${comment.isReply ? "ml-7" : ""}`}>
            <div className="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700">
              {comment.name[0]}
            </div>
            <div className="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 shadow-sm">
              <div className="flex items-center justify-between text-xs text-slate-500">
                <span className="font-semibold text-slate-700">{comment.name}</span>
                <span>{comment.time}</span>
              </div>
              <p className="mt-0.5 text-xs text-slate-500">{comment.major}</p>
              <p className="mt-1.5 text-sm leading-relaxed text-slate-700">{comment.message}</p>
            </div>
          </div>
        );
      }

      function BottomNav({ active }) {
        const navItems = [
          { key: "home", label: "Home", icon: <HomeIcon /> },
          { key: "explore", label: "Explore", icon: <CompassIcon /> },
          { key: "saved", label: "Saved", icon: <BookmarkIcon /> },
          { key: "discuss", label: "Discuss", icon: <ChatIcon /> },
        ];

        return (
          <nav className="grid grid-cols-4 border-t border-slate-200 bg-white/95 px-3 py-2 backdrop-blur-sm">
            {navItems.map((item) => {
              const isActive = item.key === active;
              return (
                <button
                  key={item.key}
                  className={`flex flex-col items-center gap-1 rounded-xl py-1.5 text-[11px] font-medium transition ${
                    isActive ? "text-brand-600" : "text-slate-500 hover:text-slate-800"
                  }`}
                >
                  {item.icon}
                  {item.label}
                </button>
              );
            })}
          </nav>
        );
      }

      function FeedView() {
        return (
          <section className="flex h-full flex-col">
            <header className="border-b border-slate-100 bg-gradient-to-r from-white to-brand-50 px-5 pb-4 pt-5">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-extrabold tracking-tight text-slate-900">CampusDigest</h2>
                <span className="rounded-full bg-white px-2.5 py-1 text-xs font-medium text-slate-500 shadow-sm">
                  Personalized Feed
                </span>
              </div>
              <p className="mt-3 text-sm font-medium text-slate-700">
                Good morning, Alex! Your April 12 digest is ready.
              </p>
              <p className="mt-1 text-xs text-slate-500">
                Curated by your interests: AI, fintech, wellness, and campus policy.
              </p>
            </header>

            <div className="flex-1 space-y-4 overflow-y-auto px-5 py-4">
              <div className="no-scrollbar -mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
                {categories.map((category, index) => (
                  <CategoryChip key={category} label={category} active={index === 0} />
                ))}
              </div>
              <div className="space-y-3">
                {articles.map((article) => (
                  <ArticleCard key={article.id} article={article} />
                ))}
              </div>
            </div>

            <BottomNav active="home" />
          </section>
        );
      }

      function DiscussionView() {
        return (
          <section className="flex h-full flex-col">
            <header className="border-b border-slate-100 bg-white px-5 pb-4 pt-5">
              <button className="mb-2 inline-flex items-center gap-1 text-sm font-medium text-slate-500 transition hover:text-slate-800">
                <span aria-hidden="true">←</span> Back
              </button>
              <h2 className="text-base font-bold leading-snug text-slate-900">
                OpenAI GPT-5 - Discussion Room
              </h2>
              <div className="mt-2 flex items-center justify-between">
                <span className="rounded-full bg-mint-100 px-3 py-1 text-xs font-semibold text-mint-500">
                  24 active members
                </span>
                <span className="text-xs text-slate-500">Room tied to article #A-1042</span>
              </div>
            </header>

            <div className="flex-1 space-y-3 overflow-y-auto px-5 py-4">
              {comments.map((comment) => (
                <CommentBubble key={comment.id} comment={comment} />
              ))}
            </div>

            <div className="border-t border-slate-200 px-4 py-3">
              <div className="flex items-center gap-2 rounded-2xl border border-slate-200 bg-slate-50 p-2 shadow-inner">
                <input
                  type="text"
                  value="What did you think about the citation safeguards?"
                  readOnly
                  className="w-full bg-transparent px-2 text-sm text-slate-600 outline-none"
                />
                <button className="rounded-xl bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-500">
                  Send
                </button>
              </div>
            </div>

            <BottomNav active="discuss" />
          </section>
        );
      }

      function App() {
        return (
          <main className="mx-auto max-w-7xl px-4 py-8 sm:px-8 sm:py-12">
            <div className="mb-7 text-center">
              <h1 className="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">
                CampusDigest - Daily News Digest for Students
              </h1>
              <p className="mx-auto mt-2 max-w-2xl text-sm text-slate-600">
                Front-end interface mockup showing personalized feeds, saved actions, reactions,
                comments, and article-linked discussion rooms.
              </p>
            </div>

            <div className="grid gap-8 xl:grid-cols-2">
              <div className="mx-auto w-full max-w-[390px] rounded-[30px] border border-slate-200 bg-white shadow-soft">
                <FeedView />
              </div>
              <div className="mx-auto w-full max-w-[390px] rounded-[30px] border border-slate-200 bg-white shadow-soft">
                <DiscussionView />
              </div>
            </div>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
